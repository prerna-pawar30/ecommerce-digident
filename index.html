<!doctype html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Title -->
    <title>
      Digident | Buy Digital Dental Products, CAD/CAM & Implant Components
    </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Shop premium digital dental products at Digident. Explore CAD/CAM solutions, ScanBridge libraries, implant components, dental accessories, and advanced digital dentistry products."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Digident, digital dentistry, CAD CAM products, implant components, dental ecommerce, dental accessories, ScanBridge libraries, dental solutions"
    />

    <!-- Author -->
    <meta name="author" content="Digident" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://digident.in/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="Digident | Digital Dental Ecommerce Store"
    />
    <meta
      property="og:description"
      content="Buy premium CAD/CAM products, implant components, ScanBridge libraries, and advanced digital dental products online."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digident.in/" />
    <meta property="og:image" content="https://digident.in/logo.png" />
    <meta property="og:site_name" content="Digident" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Digident | Digital Dental Ecommerce Store"
    />
    <meta
      name="twitter:description"
      content="Shop CAD/CAM products, implant components, and digital dentistry solutions online."
    />
    <meta name="twitter:image" content="https://digident.in/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Google AdSense -->
    <!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your real AdSense Publisher ID -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9351805624211436"
     crossorigin="anonymous"></script>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Digident",
        "url": "https://digident.in/",
        "logo": "https://digident.in/logo.png",
        "description": "Digital dental ecommerce platform for CAD/CAM products and implant components.",
        "sameAs": [],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://digident.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <!-- SEO H1 -->
    <h1 style="display: none;">
      Digident Digital Dental Ecommerce Store
    </h1>

    <!-- React Root -->
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
